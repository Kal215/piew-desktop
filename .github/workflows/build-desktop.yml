name: Build & Release PIEW Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Run Tests
      run: dotnet test --no-restore --verbosity normal

    - name: Publish Standalone Executable (.exe)
      run: >
        dotnet publish src/Piew.Desktop.App/Piew.Desktop.App.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -o ./publish

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PiewDesktop-Windows-x64
        path: ./publish/PiewDesktop.exe
        if-no-files-found: error
